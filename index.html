<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="index.css">
  </head>
  <body>
    <div>
        <div height="100px">
            100px height div
        </div>
        <div class="sticky">
            <div class="container">
                <img class="in-sticky" src="https://placehold.co/150x150" alt="Placeholder Image" />
                <div class="overlapping">
                    <div>text 1</div>
                    <div>text 2</div>
                    <div>text 3</div>
                </div>

            </div>
        </div>
        <div>
            <div class="container">
                <img class="not-in-sticky" src="https://placehold.co/150x150" alt="Placeholder Image" />
                <div class="overlapping">
                    <div>text 1</div>
                    <div>text 2</div>
                    <div>text 3</div>
                </div>

            </div>
        </div>
    </div>
  </body>
</html>
